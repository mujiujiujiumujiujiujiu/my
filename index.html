<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>引力洞 · 背屏接泡泡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #0a0a0a;
            cursor: none;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            // ---------- 固定设计分辨率 ----------
            const DESIGN_W = 904;
            const DESIGN_H = 572;

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // 自适应缩放
            function resizeCanvas() {
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const scaleX = winW / DESIGN_W;
                const scaleY = winH / DESIGN_H;
                const scale = Math.min(scaleX, scaleY);
                canvas.width = DESIGN_W;
                canvas.height = DESIGN_H;
                canvas.style.width = (DESIGN_W * scale) + 'px';
                canvas.style.height = (DESIGN_H * scale) + 'px';
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ---------- 硬件映射：左侧两个黑色摄像头（黑洞） ----------
            const BLACK_HOLES = [
                { x: 140, y: 190, r: 85 },
                { x: 140, y: 400, r: 85 }
            ];

            // ---------- 玩家：白色引力核心 ----------
            const PLAYER = {
                x: DESIGN_W / 2,
                y: DESIGN_H / 2,
                r: 40,
                grabRadius: 200,
                maxSpeed: 4.2
            };

            // ---------- 游戏状态 ----------
            let bubbles = [];
            let particles = [];
            let score = 0;
            let lost = 0;
            let combo = 0;
            let maxCombo = 0;
            let spawnTimer = 0;
            const SPAWN_INTERVAL = 20;
            let frameCount = 0;
            let shakeX = 0,
                shakeY = 0;
            let shakeIntensity = 0;

            // ---------- 辅助 ----------
            function random(min, max) { return Math.random() * (max - min) + min; }

            function isInsideBlackHole(x, y) {
                for (let h of BLACK_HOLES) {
                    const dx = x - h.x,
                        dy = y - h.y;
                    if (dx * dx + dy * dy < h.r * h.r) return true;
                }
                return false;
            }

            function isBubbleInHole(bx, by, br) {
                for (let h of BLACK_HOLES) {
                    const dx = bx - h.x,
                        dy = by - h.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < h.r + br) return true;
                }
                return false;
            }

            // ---------- 生成泡泡 ----------
            function spawnBubble() {
                const radius = random(12, 28);
                const x = DESIGN_W + radius + random(10, 60);
                const y = random(radius + 10, DESIGN_H - radius - 10);
                const vx = -random(0.6, 1.8);
                const vy = random(-0.5, 0.5);
                const hue = random(0, 360);
                const sat = random(70, 100);
                const lig = random(55, 80);
                const color = `hsl(${hue}, ${sat}%, ${lig}%)`;
                const glowColor = `hsla(${hue}, 100%, 75%, 0.4)`;
                // 随机类型：0=普通，1=金色（双倍），2=暗色（扣分）
                let type = 0;
                const roll = Math.random();
                if (roll < 0.08) type = 1;
                else if (roll < 0.14) type = 2;
                bubbles.push({
                    x,
                    y,
                    radius,
                    vx,
                    vy,
                    color,
                    glowColor,
                    type,
                    phase: random(0, Math.PI * 2),
                    trail: []
                });
            }

            // ---------- 粒子特效 ----------
            function catchEffect(bubble) {
                const count = Math.floor(bubble.radius * 1.5) + 8;
                const hue = parseInt(bubble.color.match(/\d+/)[0]) || 200;
                const isGold = bubble.type === 1;
                const isDark = bubble.type === 2;

                for (let i = 0; i < count; i++) {
                    const angle = random(0, Math.PI * 2);
                    const speed = random(1.5, 6.5);
                    const size = random(2, 7);
                    let h = hue + random(-30, 30);
                    let s = 90,
                        l = 70;
                    if (isGold) { h = 45 + random(-10, 10);
                        s = 100;
                        l = 75; } else if (isDark) { h = 0;
                        s = 0;
                        l = random(20, 50); }
                    particles.push({
                        x: bubble.x,
                        y: bubble.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 0.8,
                        radius: size,
                        life: 1.0,
                        decay: random(0.012, 0.028),
                        color: `hsl(${h}, ${s}%, ${l}%)`,
                        gravity: 0.04
                    });
                }
                // 额外光晕
                for (let i = 0; i < 5; i++) {
                    const angle = random(0, Math.PI * 2);
                    const dist = random(5, 20);
                    particles.push({
                        x: bubble.x + Math.cos(angle) * dist,
                        y: bubble.y + Math.sin(angle) * dist,
                        vx: Math.cos(angle) * random(0.2, 0.8),
                        vy: Math.sin(angle) * random(0.2, 0.8) - 0.3,
                        radius: random(4, 12),
                        life: 1.0,
                        decay: random(0.02, 0.04),
                        color: isGold ? 'rgba(255,215,0,0.6)' : `hsla(${hue + random(-20,20)}, 100%, 80%, 0.5)`,
                        gravity: 0.01,
                        glow: true
                    });
                }

                // 计分
                let points = 1;
                if (isGold) points = 3;
                else if (isDark) points = -2;
                score += points;

                // 连击
                if (points > 0) {
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    if (combo > 5) {
                        // 连击特效
                        for (let i = 0; i < 10; i++) {
                            const angle = random(0, Math.PI * 2);
                            const speed = random(2, 5);
                            particles.push({
                                x: bubble.x + Math.cos(angle) * 20,
                                y: bubble.y + Math.sin(angle) * 20,
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed - 1,
                                radius: random(3, 8),
                                life: 1.0,
                                decay: random(0.015, 0.03),
                                color: `hsl(${random(0,360)}, 100%, 75%)`,
                                gravity: 0.02
                            });
                        }
                    }
                } else {
                    combo = 0;
                }

                // 屏幕震动
                if (isGold) {
                    shakeIntensity = 3;
                } else if (isDark) {
                    shakeIntensity = 5;
                } else {
                    shakeIntensity = Math.min(2, 1 + combo * 0.1);
                }
            }

            function swallowEffect(x, y) {
                for (let i = 0; i < 18; i++) {
                    const angle = random(0, Math.PI * 2);
                    const dist = random(3, 28);
                    particles.push({
                        x: x + Math.cos(angle) * dist,
                        y: y + Math.sin(angle) * dist,
                        vx: -Math.cos(angle) * random(0.3, 1.8),
                        vy: -Math.sin(angle) * random(0.3, 1.8),
                        radius: random(2, 6),
                        life: 1.0,
                        decay: random(0.02, 0.045),
                        color: `hsl(0, 0%, ${random(5, 35)}%)`,
                        gravity: 0.02
                    });
                }
                lost++;
                combo = 0;
                shakeIntensity = 4;
            }

            // ---------- 更新 ----------
            function update() {
                frameCount++;

                // 生成泡泡
                spawnTimer++;
                if (spawnTimer >= SPAWN_INTERVAL) {
                    spawnTimer = 0;
                    if (bubbles.length < 55) {
                        spawnBubble();
                        if (Math.random() < 0.2) spawnBubble();
                    }
                }

                // 更新粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity || 0.06;
                    p.life -= p.decay;
                    p.radius *= 0.99;
                    if (p.life <= 0 || p.radius < 0.2) {
                        particles.splice(i, 1);
                    }
                }

                // 限制粒子数量
                if (particles.length > 500) {
                    particles.splice(0, particles.length - 500);
                }

                // 更新泡泡
                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];

                    // 引力
                    const dx = PLAYER.x - b.x;
                    const dy = PLAYER.y - b.y;
                    const distToPlayer = Math.sqrt(dx * dx + dy * dy);

                    if (distToPlayer < PLAYER.grabRadius && distToPlayer > 0.5) {
                        const force = (1 - distToPlayer / PLAYER.grabRadius) * 0.28;
                        const accelX = (dx / distToPlayer) * force;
                        const accelY = (dy / distToPlayer) * force;
                        b.vx += accelX;
                        b.vy += accelY;
                        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                        if (speed > PLAYER.maxSpeed) {
                            b.vx = (b.vx / speed) * PLAYER.maxSpeed;
                            b.vy = (b.vy / speed) * PLAYER.maxSpeed;
                        }
                    }

                    b.vx *= 0.997;
                    b.vy *= 0.997;

                    b.x += b.vx;
                    b.y += b.vy;

                    // 边界
                    if (b.y - b.radius < 0) { b.y = b.radius;
                        b.vy = Math.abs(b.vy) * 0.8; }
                    if (b.y + b.radius > DESIGN_H) { b.y = DESIGN_H - b.radius;
                        b.vy = -Math.abs(b.vy) * 0.8; }

                    if (b.x + b.radius < -60 || b.x - b.radius > DESIGN_W + 120) {
                        bubbles.splice(i, 1);
                        continue;
                    }

                    // 黑洞吞噬
                    if (isBubbleInHole(b.x, b.y, b.radius)) {
                        swallowEffect(b.x, b.y);
                        bubbles.splice(i, 1);
                        continue;
                    }

                    // 玩家接住
                    if (distToPlayer < PLAYER.r + b.radius) {
                        catchEffect(b);
                        bubbles.splice(i, 1);
                        continue;
                    }
                }

                // 衰减屏幕震动
                if (shakeIntensity > 0) {
                    shakeX = (Math.random() - 0.5) * shakeIntensity * 1.2;
                    shakeY = (Math.random() - 0.5) * shakeIntensity * 1.2;
                    shakeIntensity *= 0.92;
                    if (shakeIntensity < 0.1) shakeIntensity = 0;
                } else {
                    shakeX = 0;
                    shakeY = 0;
                }
            }

            // ---------- 绘制 ----------
            function draw() {
                ctx.save();
                ctx.translate(shakeX, shakeY);

                ctx.clearRect(0, 0, DESIGN_W, DESIGN_H);

                // ---- 星空背景 ----
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

                // 星星
                const starSeed = 12345;
                for (let i = 0; i < 120; i++) {
                    const sx = ((i * 137 + 33) % DESIGN_W);
                    const sy = ((i * 251 + 77) % DESIGN_H);
                    const brightness = 0.1 + ((i * 37) % 100) / 200;
                    ctx.fillStyle = `rgba(255,255,255,${brightness})`;
                    const size = 0.5 + ((i * 13) % 3) * 0.5;
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ---- 黑洞 ----
                for (let h of BLACK_HOLES) {
                    // 外发光
                    const grad = ctx.createRadialGradient(h.x, h.y, h.r * 0.6, h.x, h.y, h.r + 35);
                    grad.addColorStop(0, 'rgba(255, 30, 50, 0)');
                    grad.addColorStop(0.5, 'rgba(255, 20, 40, 0.12)');
                    grad.addColorStop(1, 'rgba(255, 0, 30, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r + 35, 0, Math.PI * 2);
                    ctx.fill();

                    // 主体
                    ctx.shadowColor = 'rgba(255,0,0,0.15)';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#050505';
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 边缘高光
                    ctx.strokeStyle = 'rgba(80, 80, 80, 0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r - 2, 0, Math.PI * 2);
                    ctx.stroke();

                    // 旋涡线条
                    const time = Date.now() * 0.0008;
                    for (let k = 0; k < 4; k++) {
                        const angle = time * 0.6 + k * (Math.PI * 2 / 4);
                        const startR = h.r * 0.15;
                        const endR = h.r * 0.85;
                        ctx.strokeStyle = `rgba(255, 60, 60, ${0.08 + 0.04 * Math.sin(time + k)})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(h.x + Math.cos(angle) * startR, h.y + Math.sin(angle) * startR);
                        const cpR = (startR + endR) / 2 + 10 * Math.sin(time * 0.7 + k);
                        ctx.quadraticCurveTo(
                            h.x + Math.cos(angle + 0.4) * cpR,
                            h.y + Math.sin(angle + 0.4) * cpR,
                            h.x + Math.cos(angle + 0.7) * endR,
                            h.y + Math.sin(angle + 0.7) * endR
                        );
                        ctx.stroke();
                    }

                    // 内圈暗影
                    const innerGrad = ctx.createRadialGradient(h.x - 10, h.y - 10, 5, h.x, h.y, h.r);
                    innerGrad.addColorStop(0, 'rgba(20,20,20,0.3)');
                    innerGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = innerGrad;
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ---- 泡泡 ----
                for (let b of bubbles) {
                    // 轨迹拖尾
                    if (b.trail.length > 6) b.trail.shift();
                    b.trail.push({ x: b.x, y: b.y });
                    for (let t = 0; t < b.trail.length - 1; t++) {
                        const alpha = (t / b.trail.length) * 0.15;
                        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(b.trail[t].x, b.trail[t].y, b.radius * 0.2 * (t / b.trail.length), 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 发光
                    const grd = ctx.createRadialGradient(b.x - 3, b.y - 3, 2, b.x, b.y, b.radius * 1.8);
                    grd.addColorStop(0, b.glowColor);
                    grd.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    // 主体
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(b.x - b.radius * 0.28, b.y - b.radius * 0.28, b.radius * 0.3, b.radius * 0.16, -0.5, 0, Math
                        .PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(b.x - b.radius * 0.12, b.y - b.radius * 0.42, b.radius * 0.15, b.radius * 0.08, -0.4, 0, Math
                        .PI * 2);
                    ctx.fill();

                    // 特殊标记
                    if (b.type === 1) {
                        // 金色星星标记
                        ctx.fillStyle = 'rgba(255,215,0,0.7)';
                        ctx.font = `${b.radius * 0.8}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('★', b.x, b.y + 1);
                    } else if (b.type === 2) {
                        // 暗色标记
                        ctx.fillStyle = 'rgba(100,100,100,0.4)';
                        ctx.font = `${b.radius * 0.7}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('✦', b.x, b.y + 1);
                    }
                }

                // ---- 粒子 ----
                for (let p of particles) {
                    ctx.globalAlpha = p.life;
                    if (p.glow) {
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = p.color;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.3, p.radius), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // ---- 玩家 ----
                const p = PLAYER;

                // 引力范围光晕
                const glowGrad = ctx.createRadialGradient(p.x, p.y, p.r * 0.4, p.x, p.y, p.grabRadius);
                glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
                glowGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.025)');
                glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.grabRadius, 0, Math.PI * 2);
                ctx.fill();

                // 脉动光环
                const pulse = 1 + 0.04 * Math.sin(Date.now() * 0.003);
                ctx.strokeStyle = `rgba(255,255,255,${0.06 + 0.03 * Math.sin(Date.now() * 0.004)})`;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 6]);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.grabRadius * pulse, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 核心
                const coreGrad = ctx.createRadialGradient(p.x - 12, p.y - 12, 6, p.x, p.y, p.r);
                coreGrad.addColorStop(0, '#ffffff');
                coreGrad.addColorStop(0.5, '#f0f4ff');
                coreGrad.addColorStop(1, 'rgba(180, 210, 255, 0.5)');
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                ctx.shadowBlur = 35;
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.ellipse(p.x - 14, p.y - 14, 14, 9, -0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.ellipse(p.x - 6, p.y - 20, 7, 4, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // ---- UI ----
                // 分数面板
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(DESIGN_W - 200, 10, 185, 80, 10) : ctx.rect(DESIGN_W - 200, 10, 185, 80);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.font = 'bold 20px "PingFang SC", "Helvetica Neue", sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';

                ctx.fillStyle = '#7bed9f';
                ctx.fillText(`✅ ${score}`, DESIGN_W - 25, 16);
                ctx.fillStyle = '#ff6b81';
                ctx.fillText(`💀 ${lost}`, DESIGN_W - 25, 46);

                // 连击显示
                if (combo > 2) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.font = `bold ${18 + Math.min(combo * 0.5, 10)}px sans-serif`;
                    ctx.fillStyle = `rgba(255, 215, 0, ${0.6 + 0.4 * Math.sin(Date.now() * 0.01)})`;
                    ctx.fillText(`🔥 ${combo}连击!`, DESIGN_W / 2, DESIGN_H - 20);
                }

                // 底部提示
                ctx.font = '13px "PingFang SC", sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillText('← 滑动控制引力 · 接住泡泡 · 避开黑洞 →', 20, DESIGN_H - 12);

                ctx.restore();
            }

            // ---------- 循环 ----------
            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // ---------- 事件 ----------
            function handlePointer(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                let canvasX = (clientX - rect.left) * scaleX;
                let canvasY = (clientY - rect.top) * scaleY;

                const margin = PLAYER.r + 5;
                canvasX = Math.max(margin, Math.min(DESIGN_W - margin, canvasX));
                canvasY = Math.max(margin, Math.min(DESIGN_H - margin, canvasY));

                PLAYER.x = canvasX;
                PLAYER.y = canvasY;
            }

            canvas.addEventListener('mousemove', handlePointer);
            canvas.addEventListener('touchmove', handlePointer, { passive: false });
            canvas.addEventListener('click', handlePointer);
            canvas.addEventListener('touchstart', handlePointer, { passive: false });

            // ---------- 启动 ----------
            loop();

            // 初始泡泡
            for (let i = 0; i < 10; i++) {
                setTimeout(() => spawnBubble(), i * 100 + 50);
            }

            console.log('✨ 引力洞启动！滑动控制引力核心，接住彩色泡泡，避开左侧黑洞！');
        })();
    </script>
</body>
</html>
